<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DataLoom - Database Optimization</title>
    {% load static %}
    <link rel="stylesheet" href="{% static 'optimizer/styles.css' %}">
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;600;700&family=Inter:wght@400;500&family=Fira+Code:wght@400;500&display=swap">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
</head>
<body>
    <div class="container">
        <header>
            <div class="logo-container">
                <a href="{% url 'landing' %}" class="logo-link">
                    <div class="logo">
                        <i class="fas fa-database"></i>
                        <i class="fas fa-comment-alt"></i>
                    </div>
                    <h1>DataLoom</h1>
                </a>
            </div>
            <div class="header-right">
                <a href="{% url 'mcp' %}" class="nav-link">Database MCP</a>
                <button class="theme-toggle" id="themeToggle">
                    <i class="fas fa-moon"></i>
                    <i class="fas fa-sun"></i>
                </button>
            </div>
        </header>

        <main>
            <div class="page-title">
                <h2>Database Optimization</h2>
                <p>Optimize your SQL queries and database schema for maximum performance</p>
            </div>

            <div class="connection-section">
                <h3>SQL Optimization</h3>
                <div class="connection-form">
                    <div class="form-group">
                        <label for="schema">Database Schema</label>
                        <textarea id="schema" placeholder="Enter your database schema here..." rows="10"></textarea>
                    </div>
                    <div class="form-group">
                        <label for="queries">SQL Queries</label>
                        <textarea id="queries" placeholder="Enter your SQL queries here..." rows="10"></textarea>
                    </div>
                    <div class="form-actions">
                        <button id="validateBtn" class="btn primary-btn">
                            <i class="fas fa-check-circle"></i> Validate Schema
                        </button>
                        <button id="optimizeQueryBtn" class="btn primary-btn">
                            <i class="fas fa-bolt"></i> Optimize Queries
                        </button>
                        <button id="optimizeSchemaBtn" class="btn primary-btn">
                            <i class="fas fa-table"></i> Optimize Schema
                        </button>
                        <button id="suggestIndexesBtn" class="btn primary-btn">
                            <i class="fas fa-search"></i> Suggest Indexes
                        </button>
                    </div>
                </div>
            </div>

            <div class="results-section" id="resultsSection">
                <div class="results-header">
                    <h3>Results</h3>
                </div>
                <pre id="results">Results will appear here...</pre>
            </div>
        </main>

        <div class="loading-overlay" id="loadingOverlay">
            <div class="loading-spinner"></div>
            <p id="loadingText">Analyzing and optimizing your SQL...</p>
        </div>

        <div class="toast" id="error"></div>

        <footer>
            <!-- <p>&copy; 2025 DataLoom. All rights reserved.</p> -->
        </footer>
    </div>

    <script src="{% static 'optimizer/script.js' %}"></script>
</body>
</html>
